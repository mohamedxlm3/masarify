<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" id="metaTheme" content="#0B1220">
<title>مصاريفي 💰</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
:root{--bg:#F4F6FB;--bgT:rgba(244,246,251,.85);--card:#FFFFFF;--card2:#FFFFFF;--navBg:rgba(255,255,255,.92);
--ink:#101B2D;--mut:#66748C;--line:#E3E8F2;--acc:#E8960F;--ok:#0FA968;--bad:#E5484D;--inc:#0FA968;--exp:#E5484D;
--gradA:#00B386;--gradB:#0086C9;--chip:rgba(16,27,45,.055);--shadow:0 4px 18px rgba(20,40,80,.09)}
[data-theme=dark]{--bg:#0B1220;--bgT:rgba(11,18,32,.82);--card:rgba(255,255,255,.055);--card2:rgba(21,29,48,.98);--navBg:rgba(13,20,35,.92);
--ink:#EAF0FA;--mut:#8CA0BF;--line:rgba(255,255,255,.1);--acc:#FFC15E;--ok:#2EE6A8;--bad:#FF6B6B;--inc:#2EE6A8;--exp:#FF6B6B;
--gradA:#00C48C;--gradB:#0091D5;--chip:rgba(255,255,255,.07);--shadow:0 4px 22px rgba(0,0,0,.4)}
[data-theme=dark] .card{backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.07)}
html,body{background:var(--bg);color:var(--ink)}
body{padding-bottom:96px;
 background-image:radial-gradient(900px 460px at 85% -8%,rgba(0,190,145,.10),transparent 60%),
 radial-gradient(760px 400px at 8% -4%,rgba(0,140,220,.09),transparent 60%)}
main{padding:14px;max-width:640px;margin:0 auto}
.hidden{display:none!important}
header{display:flex;align-items:center;gap:8px;padding:12px 16px;max-width:640px;margin:0 auto;
position:sticky;top:0;z-index:40;backdrop-filter:blur(16px);background:var(--bgT);border-bottom:1px solid var(--line)}
header h1{font-size:19px}
header .sp{flex:1}
#hdrBal{background:var(--chip);padding:6px 13px;border-radius:20px;font-weight:800;font-size:12.5px;cursor:pointer;font-variant-numeric:tabular-nums}
#cloudBtn{background:var(--chip);border:1.5px solid var(--line);padding:6px 11px;border-radius:20px;font-size:12.5px;font-weight:800;cursor:pointer;color:var(--ink)}
#cloudBtn.on{color:var(--inc);border-color:var(--inc)}
#cloudBtn.busy{opacity:.6;pointer-events:none}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card h3{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.card.tap{cursor:pointer;transition:transform .12s}
.card.tap:active{transform:scale(.98)}
.mut{color:var(--mut);font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.btn{border:0;border-radius:13px;padding:11px 15px;font-size:15px;font-weight:700;cursor:pointer;
background:linear-gradient(135deg,var(--gradA),var(--gradB));color:#fff;transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.96)}
.btn.clay{background:var(--exp)}
.btn.amber{background:var(--acc);color:#1a1206}
.btn.moov{background:var(--chip);color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.wide{width:100%}
input,select,textarea{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:11px;background:var(--chip);color:var(--ink);font-size:15px}
label{font-size:12.5px;color:var(--mut);display:block;margin:9px 0 4px;font-weight:700}
.big{font-size:34px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.pos{color:var(--inc)}.neg{color:var(--exp)}
#nav{position:fixed;bottom:0;left:0;right:0;background:var(--navBg);backdrop-filter:blur(16px);
border-top:1px solid var(--line);display:flex;z-index:50;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
#nav button{flex:1;border:0;background:none;padding:5px 2px;font-size:10.5px;color:var(--mut);cursor:pointer;border-radius:14px}
#nav button .ic{display:block;font-size:20px;margin-bottom:2px;padding:2px 16px;border-radius:13px;transition:.2s}
#nav button.on{color:var(--acc);font-weight:800}
#nav button.on .ic{background:var(--chip)}
#fab{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));inset-inline-start:16px;width:60px;height:60px;border-radius:50%;border:0;z-index:55;cursor:pointer;
background:linear-gradient(135deg,var(--gradA),var(--gradB));color:#fff;font-size:32px;font-weight:300;line-height:1;
box-shadow:0 8px 24px rgba(0,180,140,.4);display:flex;align-items:center;justify-content:center;transition:transform .15s;animation:fabIn .5s cubic-bezier(.2,.7,.3,1.4)}
#fab:active{transform:scale(.9)}
@keyframes fabIn{from{transform:scale(0)}}
.hero{border-radius:24px;padding:22px 18px;color:#fff;margin-bottom:14px;position:relative;overflow:hidden;
background:linear-gradient(135deg,var(--gradA),var(--gradB));box-shadow:0 10px 30px rgba(0,150,120,.35)}
.hero::before{content:'';position:absolute;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.14);top:-70px;inset-inline-end:-50px}
.hero::after{content:'';position:absolute;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.09);bottom:-50px;inset-inline-start:30px}
.hlabel{font-size:13px;opacity:.92;font-weight:600}
.hval{font-size:36px;font-weight:800;letter-spacing:-.5px;margin:5px 0;font-variant-numeric:tabular-nums}
.hsub{font-size:12.5px;opacity:.9}
.hbtns{display:flex;gap:9px;margin-top:15px;position:relative;z-index:1}
.hbtn{flex:1;border:0;border-radius:12px;padding:11px;font-size:14.5px;font-weight:800;cursor:pointer;background:rgba(255,255,255,.22);color:#fff;backdrop-filter:blur(6px);transition:transform .12s}
.hbtn:active{transform:scale(.95)}
.hbtn.alt{background:#fff;color:#0c7a5c}
.qs{background:var(--card);border-radius:16px;padding:11px 6px;text-align:center;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s}
[data-theme=dark] .qs{border:1px solid rgba(255,255,255,.07);backdrop-filter:blur(14px)}
.qs:active{transform:scale(.95)}
.qs .v{font-size:15.5px;font-weight:800;font-variant-numeric:tabular-nums}
.qs .l{font-size:10.5px;color:var(--mut);margin-top:2px}
.anim{animation:fadeUp .5s cubic-bezier(.2,.7,.3,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .hd{font-size:11px;color:var(--mut);font-weight:700;padding:4px 0}
.cal .d{padding:7px 2px;border-radius:11px;font-size:13px;cursor:pointer;position:relative;min-height:44px;transition:background .15s}
.cal .d:active{background:var(--chip)}
.cal .d.today{border:2px solid var(--acc)}
.cal .d.sel{background:var(--acc);color:#1a1206;font-weight:800}
.cal .d .bdg{display:inline-block;background:var(--exp);color:#fff;font-size:9px;border-radius:8px;padding:1px 5px;margin-top:2px}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
.mnav b{font-size:16px}
.item{display:flex;align-items:center;gap:9px;padding:10px 4px;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.item .ic{font-size:20px}
.item .tx{flex:1;min-width:0}.item .tx b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .amt{font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.tag{font-size:10px;background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:1px 6px;margin-inline-start:4px}
.alert{border-radius:13px;padding:10px 13px;margin-bottom:9px;font-size:13px;font-weight:600}
.alert.red{background:rgba(229,72,77,.13);color:var(--exp)}
.alert.yel{background:rgba(232,150,15,.13);color:var(--acc)}
[data-theme=dark] .alert.red{background:rgba(255,107,107,.14)}
[data-theme=dark] .alert.yel{background:rgba(255,193,94,.12)}
.bar{height:10px;background:var(--chip);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px;transition:width .5s cubic-bezier(.2,.7,.3,1)}
.paygrid{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.paygrid span{width:38px;height:38px;border-radius:11px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;cursor:pointer;transition:.15s}
.paygrid span.paid{background:var(--ok);color:#fff;border-color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chips .c{border:2px solid var(--line);border-radius:20px;padding:5px 11px;font-size:13px;cursor:pointer}
.chips .c.on{border-color:var(--acc);background:var(--acc);color:#1a1206;font-weight:700}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;border:0;border-radius:13px;padding:10px;background:var(--card);color:var(--mut);font-weight:700;cursor:pointer;box-shadow:var(--shadow)}
.tabs button.on{background:var(--acc);color:#1a1206}
#modal{position:fixed;inset:0;background:rgba(5,10,20,.55);z-index:100;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
#modalBox{background:var(--card2);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:18px;max-height:88vh;overflow-y:auto;animation:mUp .3s cubic-bezier(.2,.7,.3,1)}
@keyframes mUp{from{transform:translateY(60px);opacity:0}}
@media(min-width:500px){#modal{align-items:center}#modalBox{border-radius:22px}}
#toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 19px;border-radius:22px;font-size:14px;font-weight:700;z-index:120;opacity:0;transition:.3s;pointer-events:none;max-width:90%}
#toast.show{opacity:1}
#mascot{position:fixed;bottom:calc(128px + env(safe-area-inset-bottom));inset-inline-end:10px;width:106px;z-index:70;cursor:pointer;
filter:drop-shadow(0 10px 20px rgba(0,0,0,.55)) drop-shadow(0 0 14px rgba(46,230,168,.18));transition:transform .2s}
#mascot:hover{transform:scale(1.06)}
#botSvg{width:100%;display:block;overflow:visible}
#botAll{transform-box:view-box;transform-origin:60px 72px}
#headG{transform-box:view-box;transform-origin:60px 44px;transition:transform .3s}
#armLG{transform-box:view-box;transform-origin:29px 77px;transition:transform .3s cubic-bezier(.2,.7,.3,1.4)}
#armRG{transform-box:view-box;transform-origin:91px 77px;transition:transform .3s cubic-bezier(.2,.7,.3,1.4)}
#pupils{transition:transform .3s ease}
.brow{transform-box:fill-box;transform-origin:center;transition:transform .25s}
#antLight{transition:fill .3s}
#chest{transition:fill .3s}
#mascot[data-em=sleep] #botAll{animation:bob 3.4s ease-in-out infinite}
#mascot[data-em=idle] #botAll{animation:bob 2.4s ease-in-out infinite}
#mascot[data-em=grump] #botAll{animation:bob 4s ease-in-out infinite}
#mascot[data-em=happy] #botAll{animation:bHop .55s ease 3}
#mascot[data-em=happy] #armLG{transform:rotate(145deg)}
#mascot[data-em=happy] #armRG{transform:rotate(-145deg)}
#mascot[data-em=happy] #headG{transform:rotate(-4deg)}
#mascot[data-em=excited] #botAll{animation:bWig .5s ease 4}
#mascot[data-em=excited] #armLG{animation:armW1 .5s ease-in-out 4}
#mascot[data-em=excited] #armRG{animation:armW2 .5s ease-in-out 4}
#mascot[data-em=angry] #botAll{animation:bShake .32s ease 5}
#mascot[data-em=angry] #armLG{transform:rotate(38deg)}
#mascot[data-em=angry] #armRG{transform:rotate(-38deg)}
#mascot[data-em=shock] #botAll{animation:bHop .4s ease 2}
#mascot[data-em=shock] #armLG{transform:rotate(70deg)}
#mascot[data-em=shock] #armRG{transform:rotate(-70deg)}
#mascot.spin #botAll{animation:bSpin .9s cubic-bezier(.35,.1,.3,1) 1!important}
#mascot[data-em=happy] #chest,#mascot[data-em=excited] #chest{animation:bPulse .45s ease 5}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-7px) rotate(1.5deg)}}
@keyframes bHop{0%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-17px) scale(1.07)}60%{transform:translateY(0) scale(.94)}}
@keyframes bShake{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg) translateX(-2px)}75%{transform:rotate(9deg) translateX(2px)}}
@keyframes bWig{0%,100%{transform:rotate(0)}25%{transform:rotate(8deg) scale(1.06)}75%{transform:rotate(-8deg) scale(1.06)}}
@keyframes bSpin{from{transform:rotate(0) scale(1)}45%{transform:rotate(200deg) scale(1.25)}to{transform:rotate(360deg) scale(1)}}
@keyframes armW1{0%,100%{transform:rotate(0)}50%{transform:rotate(125deg)}}
@keyframes armW2{0%,100%{transform:rotate(0)}50%{transform:rotate(-125deg)}}
@keyframes bPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.5)}}
#chest{transform-box:fill-box;transform-origin:center}
.mz{position:fixed;font-size:15px;color:var(--mut);z-index:68;pointer-events:none;font-weight:800;animation:zfloat 2.3s ease-out forwards}
@keyframes zfloat{0%{opacity:0;transform:translateY(4px) scale(.7)}25%{opacity:.95}100%{opacity:0;transform:translateY(-30px) scale(1.25)}}
#bubbles{position:fixed;bottom:calc(246px + env(safe-area-inset-bottom));inset-inline-end:12px;z-index:69;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.bub{background:var(--card2);border:1.5px solid var(--line);border-radius:14px 14px 4px 14px;padding:8px 12px;font-size:13px;font-weight:600;box-shadow:var(--shadow);max-width:230px;animation:pop .25s}
@keyframes pop{from{transform:scale(.6);opacity:0}}
#lock{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#lock input{width:180px;text-align:center;font-size:26px;letter-spacing:12px}
.gauge{text-align:center}
.legend{display:flex;gap:12px;justify-content:center;font-size:12px;color:var(--mut);margin-top:4px;flex-wrap:wrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%}
.topbar{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.topbar:last-child{border:0}
.egrid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:10px}
.egrid span{font-size:22px;text-align:center;padding:7px 0;border-radius:11px;cursor:pointer;background:var(--chip);transition:.12s}
.egrid span:active{transform:scale(.85);background:var(--acc)}
.wstep{display:flex;gap:12px;align-items:flex-start;margin:13px 0}
.wstep span{font-size:26px}
.sgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:8px}
.sgrid button{border:1.5px solid var(--line);background:var(--chip);color:var(--ink);border-radius:11px;padding:8px 4px;font-size:12px;font-weight:700;cursor:pointer}
.sgrid button:active{transform:scale(.94);background:var(--acc);color:#1a1206}
#adslot{max-width:640px;margin:0 auto 14px;padding:0 14px;text-align:center}
.adbox{border:2px dashed var(--line);border-radius:14px;padding:18px;color:var(--mut);font-size:13px;font-weight:600}
.adbox ins{display:block!important}
</style>
</head>
<body>

<div id="lock" class="hidden">
  <div style="font-size:44px">🔒</div>
  <h2>اكتب كود القفل</h2>
  <input id="pinIn" type="password" inputmode="numeric" maxlength="4">
  <button class="btn wide" style="max-width:180px" onclick="tryPin()">دخول</button>
  <button class="btn ghost sm" onclick="forgotPin()">نسيت الكود؟ (هتمسح كل حاجة)</button>
</div>

<header><h1>💰 مصاريفي</h1><span class="sp"></span>
<button id="cloudBtn" onclick="cloudMenu()">☁️</button>
<span id="hdrBal" onclick="go('home')" title="إجمالي محافظك"></span></header>

<main>
<section id="pg-home"></section>
<section id="pg-month" class="hidden"></section>
<section id="pg-cats" class="hidden"></section>
<section id="pg-commit" class="hidden"></section>
<section id="pg-set" class="hidden"></section>
</main>

<nav id="nav">
<button data-p="home" class="on" onclick="go('home')"><span class="ic">🏠</span>عام</button>
<button data-p="month" onclick="go('month')"><span class="ic">📅</span>الشهر</button>
<button data-p="cats" onclick="go('cats')"><span class="ic">📁</span>التصنيفات</button>
<button data-p="commit" onclick="go('commit')"><span class="ic">🗂️</span>التزاماتي</button>
<button data-p="set" onclick="go('set')"><span class="ic">⚙️</span>الإعدادات</button>
</nav>

<button id="fab" onclick="fabTap()" title="إضافة سريعة">＋</button>

<div id="mascot" data-em="sleep" onclick="mascotTap()">
<svg id="botSvg" viewBox="0 0 120 124">
<defs>
<linearGradient id="bG1" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#33476b"/><stop offset="1" stop-color="#1c2a45"/></linearGradient>
<linearGradient id="bG2" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#3d5379"/><stop offset="1" stop-color="#243352"/></linearGradient>
</defs>
<g id="botAll">
<line x1="60" y1="21" x2="60" y2="10" stroke="#5a6f94" stroke-width="3" stroke-linecap="round"/>
<circle id="antLight" cx="60" cy="7.5" r="4.5" fill="#FFC15E"/>
<g id="headG">
<rect x="30" y="21" width="60" height="48" rx="15" fill="url(#bG1)" stroke="#5a6f94" stroke-width="1.5"/>
<rect x="35" y="26" width="50" height="38" rx="11" fill="#0a1526"/>
<rect id="browL" class="brow" x="43" y="31.5" width="12" height="3.4" rx="1.7" fill="#2EE6A8"/>
<rect id="browR" class="brow" x="65" y="31.5" width="12" height="3.4" rx="1.7" fill="#2EE6A8"/>
<g id="eyesG">
<g id="pupils">
<circle id="eyeL" cx="49" cy="43" r="6.2" fill="#2EE6A8"/>
<circle id="eyeR" cx="71" cy="43" r="6.2" fill="#2EE6A8"/>
<circle id="pupL" cx="49" cy="43" r="2.7" fill="#0a1526"/>
<circle id="pupR" cx="71" cy="43" r="2.7" fill="#0a1526"/>
<circle cx="51" cy="41" r="1.7" fill="#eafff6" opacity=".85"/>
<circle cx="73" cy="41" r="1.7" fill="#eafff6" opacity=".85"/>
</g>
</g>
<g id="eyesShut" style="display:none">
<path d="M43 44 q6 5 12 0" stroke="#2EE6A8" stroke-width="2.6" fill="none" stroke-linecap="round"/>
<path d="M65 44 q6 5 12 0" stroke="#2EE6A8" stroke-width="2.6" fill="none" stroke-linecap="round"/>
</g>
<path id="mouth" d="M52 55 q8 4.5 16 0" stroke="#2EE6A8" stroke-width="2.6" fill="none" stroke-linecap="round"/>
</g>
<rect x="33" y="71" width="54" height="38" rx="13" fill="url(#bG2)" stroke="#5a6f94" stroke-width="1.5"/>
<circle id="chest" cx="60" cy="90" r="7.5" fill="#00C48C"/>
<circle id="chestIn" cx="60" cy="90" r="3" fill="#eafff6" opacity=".65"/>
<g id="armLG"><rect x="23.5" y="75" width="9" height="25" rx="4.5" fill="url(#bG1)" stroke="#5a6f94" stroke-width="1.2"/></g>
<g id="armRG"><rect x="87.5" y="75" width="9" height="25" rx="4.5" fill="url(#bG1)" stroke="#5a6f94" stroke-width="1.2"/></g>
<rect x="40" y="109" width="13" height="9" rx="4.5" fill="#243352" stroke="#5a6f94" stroke-width="1.2"/>
<rect x="67" y="109" width="13" height="9" rx="4.5" fill="#243352" stroke="#5a6f94" stroke-width="1.2"/>
</g>
</svg>
</div>

<div id="bubbles"></div>
<div id="toast"></div>
<div id="modal" class="hidden"><div id="modalBox"></div></div>

<!-- مساحة الإعلانات — هتظهر أوتوماتيك لما تحط كود AdSense -->
<div id="adslot"><div class="adbox" id="adBox">📢 مساحة إعلانية — حط كود AdSense من الإعدادات</div></div>

<script>
/* ================= رابط السحابة بتاعك (جاهز!) ================= */
var CLOUD_URL='https://script.google.com/macros/s/AKfycbxkOVwVQBlwp-XNNQcLdY-9nEMQbpnWma3KiZIjDvtaYWkNwnJZpPq-NZbKusKyzKOh/exec';

/* ================= أدوات ================= */

const pad=n=>String(n).padStart(2,'0');
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const mkOf=d=>d.slice(0,7);

const mkLabel=mk=>new Intl.DateTimeFormat('ar-EG',{month:'long',year:'numeric'}).format(new Date(+mk.slice(0,4),+mk.slice(5,7)-1,1));
const addMk=(mk,k)=>{let y=+mk.slice(0,4),m=+mk.slice(5,7)+k;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return y+'-'+pad(m)};
function fmt(n){const v=Math.round(n*100)/100;return (v<0?'−':'')+Math.abs(v).toLocaleString('en-US')+' '+S.uiSettings.currency}
function parseNum(s){return parseFloat(String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(',','.'))||0}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);
 el._t=setTimeout(()=>el.classList.remove('show'),2600);
 if(t.includes('❌')||t.includes('⚠️'))sfx('error');
 else if(t.includes('✅')||t.includes('🎉')||t.includes('🏆')||t.includes('☁️'))sfx('success');
 buzz(t.includes('❌')||t.includes('⚠️')?[25,40,25]:10)}

function xlEsc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function migrate(s){const d=defaultState();
 for(const k of ['bills','goals','activityLog','nextMonthPlans','mascotMood','workSettings','roundUp'])if(s[k]===undefined)s[k]=d[k];
 if(!s.wallets||!s.wallets.length)s.wallets=d.wallets;
 if(!s.wishlist)s.wishlist=[];
 if(!s.achievements)s.achievements=[];
 if(!s.cloud)s.cloud=d.cloud;
 if(!s.uiSettings)s.uiSettings=d.uiSettings;
 for(const k in d.uiSettings)if(s.uiSettings[k]===undefined)s.uiSettings[k]=d.uiSettings[k];
 for(const k in d.workSettings)if(s.workSettings[k]===undefined)s.workSettings[k]=d.workSettings[k];
 if(!s.roundUp)s.roundUp=d.roundUp;
 if(!s.emergencyFund)s.emergencyFund=d.emergencyFund;
 if(s.lastBackupDate===undefined)s.lastBackupDate=null;
 if(s.reminderDate===undefined)s.reminderDate='';
 if(s.budget===undefined)s.budget=0;
 if(s.onboarded===undefined)s.onboarded=true;
 if(!s.categories.some(c=>c.isSavings))s.categories.push(d.categories[3]);
 return s}

/* ================= محرك الحسابات ================= */
function m(mk){if(!S.months[mk])S.months[mk]={income:[],expenses:[],appliedRecurring:[],appliedRecurringIncome:[],transfers:[]};
 if(!S.months[mk].appliedRecurring)S.months[mk].appliedRecurring=[];
 if(!S.months[mk].appliedRecurringIncome)S.months[mk].appliedRecurringIncome=[];
 if(!S.months[mk].transfers)S.months[mk].transfers=[];return S.months[mk]}
const incomeTotal=mk=>m(mk).income.reduce((a,x)=>a+x.amount,0);
const expTotal=(mk,exclLeft)=>m(mk).expenses.filter(e=>!(exclLeft&&e.fromLeftover)).reduce((a,x)=>a+x.amount,0);
const consumed=mk=>m(mk).expenses.filter(e=>!e.fromLeftover&&!cat(e.catId).isSavings).reduce((a,x)=>a+x.amount,0);
const avail=mk=>incomeTotal(mk)-expTotal(mk,true);
const netTrue=mk=>incomeTotal(mk)-expTotal(mk,false);
const leftoverSpent=mk=>m(mk).expenses.filter(e=>e.fromLeftover).reduce((a,x)=>a+x.amount,0);
function potUntil(mk){let p=0;for(const k in S.months)if(k<mk)p+=Math.max(0,netTrue(k));return p}
const potShown=mk=>potUntil(mk)-leftoverSpent(mk);
const cat=id=>S.categories.find(c=>c.id===id)||{name:'محذوفة',icon:'❓',color:'#999'};
const savCat=()=>S.categories.find(c=>c.isSavings)||S.categories[0];
const savedTotal=()=>{let t=0;for(const k in S.months)for(const e of S.months[k].expenses)if(cat(e.catId).isSavings)t+=e.amount;return t};
const loanRemaining=l=>l.amount-l.payments.reduce((a,p)=>a+p.amount,0);
function spentInCat(mk,cid){return m(mk).expenses.filter(e=>e.catId===cid).reduce((a,x)=>a+x.amount,0)}
function avgExpense(n){let t=0,c=0,mk=curMk();for(let i=1;i<=n;i++){const k=addMk(mk,-i);t+=expTotal(k,false);c++}return c?t/c:0}
function dayExp(iso){return m(mkOf(iso)).expenses.filter(e=>e.date===iso&&!cat(e.catId).isSavings).reduce((a,x)=>a+x.amount,0)}
function weekExp(){let t=0;for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);
 t+=dayExp(d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()))}return t}
const wOf=e=>{const id=e.walletId;return S.wallets.some(w=>w.id===id)?id:((S.wallets[0]||{}).id||'w1')};
function walletBal(wid){let t=0;
 for(const k in S.months){const mm=S.months[k];
  mm.income.forEach(e=>{if(wOf(e)===wid)t+=e.amount});
  mm.expenses.forEach(e=>{if(wOf(e)===wid)t-=e.amount});
  (mm.transfers||[]).forEach(tr=>{if(tr.from===wid)t-=tr.amount;if(tr.to===wid)t+=tr.amount})}
 return Math.round(t*100)/100}
function totalWallets(){let t=0;
 for(const k in S.months){const mm=S.months[k];
  mm.income.forEach(e=>t+=e.amount);
  mm.expenses.forEach(e=>t-=e.amount)}
 return Math.round(t*100)/100}
function forecastInfo(){const mk=curMk(),day=new Date().getDate();
 const spent=consumed(mk);
 if(day<3||spent<=0)return null;
 const rate=spent/day,dimD=dim(mk);
 return{rate,spent,day,proj:rate*dimD,av:Math.max(0,avail(mk)+potShown(mk)),
  left:dimD-day+1,daysToZero:Math.floor(Math.max(0,avail(mk)+potShown(mk))/rate)}}
function healthScore(){
 const inc=incomeTotal(curMk()),sav=Math.max(0,m(curMk()).expenses.filter(e=>cat(e.catId).isSavings).reduce((a,x)=>a+x.amount,0));
 const p1=inc>0?Math.min(40,(sav/inc)/0.2*40):0;
 const debt=S.loans.filter(l=>l.dir==='i_owe').reduce((a,l)=>a+loanRemaining(l),0);
 let ai=0;for(let i=0;i<3;i++)ai+=incomeTotal(addMk(curMk(),-i));ai=Math.max(1,ai/3);
 const p2=debt<=0?40:Math.max(0,40*(1-debt/ai/0.5));
 const p3=billIssues().overdue.length?0:20;
 return{score:Math.round(p1+p2+p3),p1,p2,p3}}
function billIssues(){
 const t=new Date(),day=t.getDate(),mk=curMk(),overdue=[],soon=[];
 for(const b of S.bills){if(!b.dueDay)continue;
  const paid=m(mk).expenses.some(e=>e.billId===b.id);
  if(paid)continue;
  if(b.dueDay<day)overdue.push(b);else if(b.dueDay-day<=3)soon.push(b)}
 return{overdue,soon}}
function alerts(){
 const out=[];
 const bi=billIssues();
 bi.overdue.forEach(b=>out.push({cls:'red',txt:`🔴 فاتورة ${b.name} متأخرة! المفروض تتدفع يوم ${b.dueDay}`}));
 bi.soon.forEach(b=>out.push({cls:'yel',txt:`🟡 فاتورة ${b.name} مستحقة خلال ${b.dueDay-new Date().getDate()} أيام`}));
 if(S.budget>0){const bt=consumed(curMk());
  if(bt>S.budget)out.push({cls:'red',txt:`🔴 عدّيت الميزانية العامة! صرفت ${fmt(bt)} والميزانية ${fmt(S.budget)}`});
  else if(bt>=S.budget*0.8)out.push({cls:'yel',txt:`🟡 وصلت ${Math.round(bt/S.budget*100)}% من الميزانية العامة (${fmt(bt)} من ${fmt(S.budget)})`})}
 for(const c of S.categories){if(!c.cap||c.isSavings)continue;const sp=spentInCat(curMk(),c.id);
  if(sp>c.cap)out.push({cls:'red',txt:`🔴 عدّيت حد "${c.name}"! صرفت ${fmt(sp)} والحد ${fmt(c.cap)}`});
  else if(sp>=c.cap*0.8)out.push({cls:'yel',txt:`🟡 وصلت ${Math.round(sp/c.cap*100)}% من حد "${c.name}"`})}
 const prev3=cid=>{let t=0;for(let i=1;i<=3;i++)t+=m(addMk(curMk(),-i)).expenses.filter(e=>e.catId===cid).reduce((a,x)=>a+x.amount,0);return t/3};
 S.categories.filter(c=>!c.isSavings).map(c=>({c,sp:spentInCat(curMk(),c.id),av:prev3(c.id)}))
  .filter(x=>x.sp>x.av*1.4&&x.sp-x.av>=50).sort((a,b)=>b.sp-a.sp).slice(0,2)
  .forEach(x=>out.push({cls:'yel',txt:`📊 صرفت على "${x.c.name}" أكتر من المعتاد بنسبة ${Math.round((x.sp/Math.max(1,x.av)-1)*100)}%`}));
 if(!S.lastBackupDate||Date.now()-S.lastBackupDate>30*864e5)out.push({cls:'yel',txt:'💾 عدّى أكتر من 30 يوم من غير نسخة احتياطية — اعمل واحدة من الإعدادات!'});
 return out}

function checkCaps(catId){const c=cat(catId);if(!c.cap||c.isSavings)return;
 const after=spentInCat(curMk(),catId);
 if(after>c.cap)toast('🔴 تجاوزت حد '+c.name+'!');else if(after>=c.cap*0.8)toast('🟡 قربت تخلص حد '+c.name);

function commitExpense(e,opts){opts=opts||{};
 if(!e.walletId)e.walletId=(S.wallets[0]||{}).id;
 m(mkOf(e.date)).expenses.push(e);
 logAct('مصروف: '+(e.desc||'')+' ('+cat(e.catId).name+')',e.amount,e.amount<0?'income':'expense');
 if(cat(e.catId).isSavings&&!opts.silent)mascotReact('savings');
 else if(!opts.silent){
  const big=e.amount>=Math.max(200,avgExpense(3)*0.6);
  mascotReact(big?'shock':'expense')}
 if(!opts.silent&&e.amount>=Math.max(200,avgExpense(3)*0.5))setTimeout(()=>speak(pick(PH.big)),1100);
 if(mkOf(e.date)===curMk())checkCaps(e.catId);

function commitIncome(i,opts){opts=opts||{};
 if(!i.walletId)i.walletId=(S.wallets[0]||{}).id;
 m(mkOf(i.date)).income.push(i);
 logAct('دخل: '+(i.source||''),i.amount,'income');
 if(!opts.silent)mascotReact('income');
 buzz(12);save();renderAll();cloudAutoPush()}
function delEntry(mk,kind,id){
 const arr=m(mk)[kind],idx=arr.findIndex(x=>x.id===id);if(idx<0)return;
 const it=arr[idx];
 if(it.gameyaId!=null&&it.gameyaIdx!=null){const g=S.gameyas.find(x=>x.id===it.gameyaId);
  if(g&&g.links&&g.links[it.gameyaIdx]){delete g.links[it.gameyaIdx];g.payments[it.gameyaIdx]=false;
   logAct('إلغاء قسط جمعية '+g.name,it.amount,null)}}
 if(it.loanPayId){const l=S.loans.find(x=>x.id===it.loanId);
  if(l){l.payments=l.payments.filter(p=>p.id!==it.loanPayId);logAct('إلغاء سداد سلفة '+l.person,it.amount,null)}}
 if(it.loanInj){const l=S.loans.find(x=>x.id===it.loanId);if(l){l.injId=null;logAct('إلغاء حقن سلفة '+l.person,it.amount,null)}}
 if(it.goalId&&it.goalSign){const g=S.goals.find(x=>x.id===it.goalId);
  if(g){g.saved=Math.max(0,g.saved-it.goalSign*it.amount);logAct('تراجع حركة هدف: '+g.name,it.amount,null)}}
 arr.splice(idx,1);logAct('حذف عملية: '+(it.desc||it.source),Math.abs(it.amount),null);
 buzz(20);save();renderAll();cloudAutoPush()}

function cloudCall(action,payload){
 const url=CLOUD_URL+'?action='+action+(payload?'&payload='+encodeURIComponent(payload):'');
 return fetch(url,{method:'GET',redirect:'follow',mode:'cors',credentials:'omit'})
  .then(r=>r.text())
  .then(t=>{try{return JSON.parse(t)}catch(e){throw new Error('رد غير متوقع: '+t.slice(0,80))}})
  .catch(err=>{
   // fallback: نجرب عن طريق JSONP-style script
   return new Promise((res,rej)=>{
    const cb='__cl_'+Date.now();
    window[cb]=(data)=>{res(data);delete window[cb];const s=document.getElementById(cb);if(s)s.remove()};
    const s=document.createElement('script');
    s.id=cb;
    s.onerror=()=>{rej(new Error('فشل الاتصال بالسيرفر — اتأكد من النت وسجل جوجل'));delete window[cb];s.remove()};
    s.src=url+'&callback='+cb;
    document.body.appendChild(s)})})}),{method:'GET'})
 .then(r=>r.text()).then(t=>{try{return JSON.parse(t)}catch(e){throw new Error('رد غير متوقع من السيرفر')}})}
function cloudPush(){const btn=$('#cloudBtn');btn.classList.add('busy');
 return cloudCall('save',JSON.stringify(S)).then(r=>{
  if(r.ok){S.cloud.lastPush=Date.now();save();
   btn.classList.add('on');btn.textContent='☁️✓';
   toast('ارتفعت البيانات للسحابة ☁️✅')}
  else toast('فشل الرفع: '+(r.msg||r.error)+' ❌')})
 .catch(e=>toast('مشكلة اتصال: '+e.message+' ❌'))
 .finally(()=>btn.classList.remove('busy'))}
function cloudPull(silent){const btn=$('#cloudBtn');btn.classList.add('busy');
 return cloudCall('load').then(r=>{
  if(!r.ok){toast('فشل التنزيل ❌');return}
  if(!r.exists||!r.state){if(!silent)toast('السحابة فاضية — ارفع الأول ⬆️');return}
  const cloudT=r.updatedAt?new Date(r.updatedAt).getTime():0;
  const localT=S.cloud.lastPush||0;
  if(cloudT>localT+5000){
   confirmDlg(`فيه نسخة أحدث في السحابة (${new Date(r.updatedAt).toLocaleString('ar-EG')}) — هتستبدل اللي على الجهاز. تكمل؟`,()=>{
    S=migrate(r.state);S.cloud.lastPull=Date.now();
    if(r.updatedAt)S.cloud.lastPush=new Date(r.updatedAt).getTime();
    save();lastBal=null;applyTheme();mascotVis();closeModal();renderAll();
    toast('نزلت البيانات من السحابة ⬇️✅')})}
  else if(!silent)toast('بياناتك على الجهاز أحدث من السحابة ✅')})
 .catch(e=>{if(!silent)toast('مشكلة اتصال: '+e.message+' ❌')})
 .finally(()=>btn.classList.remove('busy'))}

/* ============ عداد الأرقام ============ */
let lastBal=null;
function countUp(id,val){const el=document.getElementById(id);
 if(!el){lastBal=val;return}
 const from=(lastBal==null||!isFinite(lastBal))?val:lastBal;
 const t0=performance.now(),dur=650;
 function st(){const p=Math.min(1,(performance.now()-t0)/dur),e=1-Math.pow(1-p,3);
  el.textContent=fmt(from+(val-from)*e);
  if(p<1)requestAnimationFrame(st);else lastBal=val}
 requestAnimationFrame(st)}

let tx0=null;
addEventListener('touchstart',e=>{
 if(page!=='month'||!$('#modal').classList.contains('hidden')){tx0=null;return}
 if(e.target.closest('input,textarea,select,button')){tx0=null;return}
 tx0=e.touches[0].clientX},{passive:true});
addEventListener('touchend',e=>{if(tx0==null)return;
 const dx=e.changedTouches[0].clientX-tx0;tx0=null;
 if(Math.abs(dx)>70){dx>0?navMk(-1):navMk(1)}},{passive:true});

function donut(frac,color,size,label){const C=2*Math.PI*40;
 return `<svg viewBox="0 0 100 100" width="${size}" height="${size}">
 <circle cx="50" cy="50" r="40" fill="none" stroke="var(--chip)" stroke-width="12"/>
 <circle cx="50" cy="50" r="40" fill="none" stroke="${color}" stroke-width="12" stroke-linecap="round"
  stroke-dasharray="${Math.min(frac,1)*C} ${C}" transform="rotate(-90 50 50)"/>
 <text x="50" y="55" text-anchor="middle" font-size="15" font-weight="800" fill="var(--ink)">${label}</text></svg>`}
function bars6(){const ks=[];for(let i=5;i>=0;i--)ks.push(addMk(curMk(),-i));
 const data=ks.map(k=>({k,inc:incomeTotal(k),exp:expTotal(k,false)}));
 const mx=Math.max(1,...data.map(d=>Math.max(d.inc,d.exp)));
 return `<svg viewBox="0 0 320 150" width="100%">`+
  data.map((d,i)=>{const x=14+i*52,h1=d.inc/mx*95,h2=d.exp/mx*95;
   return `<rect x="${x}" y="${115-h1}" width="18" height="${h1}" rx="4" fill="var(--inc)"/>
   <rect x="${x+20}" y="${115-h2}" width="18" height="${h2}" rx="4" fill="var(--exp)"/>
   <text x="${x+19}" y="132" text-anchor="middle" font-size="10" fill="var(--mut)">${d.k.slice(5)}</text>`}).join('')+
  `<text x="160" y="147" text-anchor="middle" font-size="9" fill="var(--mut)">🟢 دخل　🔴 مصروف</text></svg>`}

/* ============ محاكي الديون ============ */
function debtSim(){const debts=S.loans.filter(l=>l.dir==='i_owe'&&loanRemaining(l)>0);
 if(!debts.length)return toast('مفيش ديون عليك أصلاً 🎉');
 const tot=debts.reduce((a,l)=>a+loanRemaining(l),0);
 modal(`<h3>🧮 محاكي سداد الديون</h3>
 <div class="mut">إجمالي اللي عليك: <b>${fmt(tot)}</b> — طريقة كرة الثلج ❄️</div>
 <label>المبلغ اللي هتقدر تسدده شهرياً</label>
 <input id="dsA" type="number" step="0.01" oninput="debtSimRun()">
 <div id="dsOut" style="margin-top:10px"></div>
 <button class="btn ghost wide" style="margin-top:8px" onclick="closeModal()">قفل</button>`);debtSimRun()}
function debtSimRun(){const out=$('#dsOut');if(!out)return;
 const total=parseNum($('#dsA').value);
 if(total<=0){out.innerHTML='<div class="mut">اكتب المبلغ الشهري الأول</div>';return}
 let rem=S.loans.filter(l=>l.dir==='i_owe'&&loanRemaining(l)>0)
  .map(l=>({n:l.person,r:loanRemaining(l),m:0})).sort((a,b)=>a.r-b.r);
 let months=0;
 while(rem.some(d=>d.r>0)&&months<600){months++;
  let p=total;
  for(const d of rem){if(d.r<=0||p<=0)continue;
   const pay=Math.min(d.r,p);d.r-=pay;p-=pay;if(d.r<=0&&!d.m)d.m=months}}
 const y=Math.floor(months/12),mo=months%12;
 const time=months>=12?(y+' سنة'+(mo?' و'+mo+' شهر':'')):months+' شهر';
 out.innerHTML=`<div class="alert yel">ديونك هتخلص في <b>${time}</b></div>`+
  rem.map(d=>`<div class="item"><b>${esc(d.n)}</b><span style="flex:1"></span><span class="mut">${d.m?('يخلص في الشهر '+d.m):'—'}</span></div>`).join('')}

function zakatCalc(){const cash=totalWallets();
 const debt=S.loans.filter(l=>l.dir==='i_owe').reduce((a,l)=>a+loanRemaining(l),0);
 modal(`<h3>🕌 حاسبة الزكاة</h3>
 <label>النقود (رصيد محافظك: ${fmt(cash)})</label><input id="z1" type="number" step="0.01" value="${cash>0?Math.round(cash):''}" oninput="zOut()">
 <label>وزن الذهب عندك (جرام)</label><input id="z2" type="number" step="0.01" oninput="zOut()">
 <label>سعر جرام الذهب دلوقتي</label><input id="z3" type="number" step="0.01" oninput="zOut()">
 <label>قيمة الفضة</label><input id="z4" type="number" step="0.01" oninput="zOut()">
 <label>بضاعة تجارة</label><input id="z5" type="number" step="0.01" oninput="zOut()">
 <label>ديون عليك</label><input id="z6" type="number" step="0.01" value="${Math.round(debt)||''}" oninput="zOut()">
 <div id="zOut" style="margin-top:10px"></div>
 <button class="btn wide" style="margin-top:10px" onclick="zLog()">سجل مصروف الزكاة</button>
 <button class="btn ghost wide" style="margin-top:6px" onclick="closeModal()">إلغاء</button>`);zOut()}
function zTotal(){return parseNum($('#z1').value)+parseNum($('#z2').value)*parseNum($('#z3').value)
 +parseNum($('#z4').value)+parseNum($('#z5').value)-parseNum($('#z6').value)}
function zOut(){const out=$('#zOut');if(!out)return;
 const tot=zTotal(),nisab=85*parseNum($('#z3').value);
 if(tot<=0||nisab<=0){out.innerHTML='<div class="mut">دوس أرقام الأول</div>';return}
 const due=tot>=nisab,z=due?tot*0.025:0;
 out.innerHTML=`<div class="mut">النصاب (85 جرام ذهب): ${fmt(nisab)} ▪ الموعود: ${fmt(tot)}</div>
 <div class="big ${due?'pos':'neg'}" style="font-size:24px">${due?'الزكاة الواجبة: '+fmt(z):'مش واجبة — تحت النصاب ✅'}</div>`}
function zLog(){const tot=zTotal(),nisab=85*parseNum($('#z3').value);
 if(tot<nisab)return toast('مفيش زكاة واجبة ✅');
 const z=Math.round(tot*0.025*100)/100;
 const zc=S.categories.find(c=>c.name==='زكاة وصدقة')||S.categories[0];
 commitExpense({id:uid(),catId:zc.id,desc:'زكاة مال',amount:z,date:todayISO(),fromLeftover:false});
 closeModal();toast('اتسجلت ✅ '+fmt(z))}

function compressReceipt(file,cb){
 const r=new FileReader();
 r.onerror=()=>cb(null);
 r.onload=()=>{const img=new Image();
  img.onerror=()=>cb(null);
  img.onload=()=>{try{const mx=600;let w=img.width,h=img.height;
   if(w>mx||h>mx){const k=Math.min(mx/w,mx/h);w=Math.round(w*k);h=Math.round(h*k)}
   const cv=document.createElement('canvas');cv.width=w;cv.height=h;
   cv.getContext('2d').drawImage(img,0,0,w,h);cb(cv.toDataURL('image/jpeg',0.55))}
  catch(e){cb(null)}};
  img.src=r.result};
 r.readAsDataURL(file)}

function saveEntry(kind,mkArg,idArg){
 const amount=parseNum($('#fAmt').value);
 if(amount<=0){buzz([25,40,25]);return toast('اكتب مبلغ صح ❌')}
 const date=$('#fDate').value||selDay;
 const walletId=window.selW;
 const old=idArg?m(mkArg)[kind].find(x=>x.id===idArg):null;
 const oldRec=old?(old.receipt||null):null;
 const rm=$('#fRecDel')&&$('#fRecDel').checked;
 const finish=(receipt)=>{
  if(kind==='income'){
   if(old){const arr=m(mkArg).income;const i=arr.findIndex(x=>x.id===old.id);
    if(i<0)return;arr.splice(i,1);
    let amt=amount;
    if(old.loanInj){const l=S.loans.find(x=>x.id===old.loanId);if(l){l.amount=amt;l.date=date}}
    commitIncome({id:old.id,source:$('#fSrc').value||old.source,amount:amt,date,walletId,
     loanId:old.loanId,loanInj:old.loanInj,gameyaId:old.gameyaId},old.loanId?{silent:true}:{})}
   else commitIncome({id:uid(),source:$('#fSrc').value||'دخل',amount,date,walletId});
  }else{
   const catId=window.selId,fromLeftover=$('#fLeft').checked;
   if(old){const arr=m(mkArg).expenses;const i=arr.findIndex(x=>x.id===old.id);
    if(i<0)return;arr.splice(i,1);
    let amt=amount;
    if(old.gameyaId!=null){amt=old.amount;
     const g=S.gameyas.find(x=>x.id===old.gameyaId);
     if(g&&g.links&&g.links[old.gameyaIdx])g.links[old.gameyaIdx].monthKey=mkOf(date)}
    if(old.loanPayId){const l=S.loans.find(x=>x.id===old.loanId);
     if(l){const pmt=l.payments.find(pp=>pp.id===old.loanPayId);if(pmt){pmt.amount=amt;pmt.date=date}}}
    if(old.loanInj){const l=S.loans.find(x=>x.id===old.loanId);if(l){l.amount=amt;l.date=date}}
    if(old.goalId&&old.goalSign){const g=S.goals.find(x=>x.id===old.goalId);
     if(g)g.saved=Math.max(0,g.saved+(amt-old.amount)*old.goalSign)}
    commitExpense({id:old.id,catId,desc:$('#fDesc').value||old.desc,amount:amt,date,fromLeftover,receipt,walletId,
     billId:old.billId,gameyaId:old.gameyaId,gameyaIdx:old.gameyaIdx,loanId:old.loanId,loanPayId:old.loanPayId,
     goalId:old.goalId,goalSign:old.goalSign},old.loanId?{silent:true}:{})}
   else{commitExpense({id:uid(),catId,desc:$('#fDesc').value||'مصروف',amount,date,fromLeftover,receipt,walletId});
    roundUpAfter(catId,amount,date)}}
  closeModal()};
 const f=$('#fRec');
 if(kind==='expense'&&f&&f.files&&f.files[0])compressReceipt(f.files[0],rec=>finish(rec||oldRec));
 else finish(rm?null:oldRec)}
function roundUpAfter(catId,amount,date){const ru=S.roundUp;
 if(!ru||!ru.enabled||!(ru.unit>0))return;
 if(cat(catId).isSavings)return;
 const r=amount%ru.unit;if(r===0)return;
 const diff=Math.round((ru.unit-r)*100)/100;
 commitExpense({id:uid(),catId:savCat().id,desc:'تقريب تلقائي لأقرب '+ru.unit,amount:diff,date,fromLeftover:false},{silent:true});
 mascotReact('savings');toast('🪙 '+fmt(diff)+' اتحولت للادخار ✅')}

function renderCats(){

 let html=`<div class="mnav"><button class="btn ghost sm" onclick="navMk(1)">◀ بعد</button>
  <b>${mkLabel(mk)}</b><button class="btn ghost sm" onclick="navMk(-1)">فات ▶</button></div>`;
 const spent=S.categories.map(c=>({c,v:spentInCat(mk,c.id)})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
 const tot=spent.reduce((a,x)=>a+x.v,0);
 if(tot>0){let acc=0;const C=2*Math.PI*40;
  html+=`<div class="card anim"><h3>🥧 توزيع مصاريف ${mkLabel(mk)}</h3><div style="text-align:center">
  <svg viewBox="0 0 100 100" width="150" height="150">`;
  spent.slice(0,8).forEach(x=>{const f=x.v/tot;
   html+=`<circle cx="50" cy="50" r="40" fill="none" stroke="${x.c.color}" stroke-width="16"
   stroke-dasharray="${f*C} ${C}" stroke-dashoffset="${-acc*C}" transform="rotate(-90 50 50)"/>`;acc+=f});

function loanInject(l){const lcat=S.categories.find(c=>c.name==='سلف وديون')||S.categories[0];
 if(l.dir==='i_owe'){const i={id:uid(),source:'سلفة استلمتها من: '+l.person,amount:l.amount,date:l.date,loanId:l.id,loanInj:true};
  m(mkOf(l.date)).income.push(i);l.injId=i.id}
 else{const e={id:uid(),catId:lcat.id,desc:'سلفة سلفتها لـ: '+l.person,amount:l.amount,date:l.date,fromLeftover:false,loanId:l.id,loanInj:true};
  m(mkOf(l.date)).expenses.push(e);l.injId=e.id}}
function loanUninj(l){if(!l.injId)return;const k=mkOf(l.date);
 const arr=l.dir==='i_owe'?m(k).income:m(k).expenses;
 const i=arr.findIndex(x=>x.id===l.injId);if(i>=0)arr.splice(i,1);l.injId=null}
function saveLoan(id){
 if(id){const l=S.loans.find(x=>x.id===id);loanUninj(l);
  Object.assign(l,{person:$('#lP').value||l.person,dir:$('#lD').value,amount:parseNum($('#lA').value)||l.amount,
   date:$('#lDt').value||l.date,note:$('#lN').value});
  loanInject(l);logAct('تعديل سلفة '+l.person,l.amount,null)}
 else{const l={id:uid(),person:$('#lP').value||'شخص',dir:$('#lD').value,amount:parseNum($('#lA').value),
  date:$('#lDt').value||todayISO(),note:$('#lN').value,payments:[]};
  if(l.amount<=0)return toast('اكتب مبلغ صح ❌');
  S.loans.push(l);loanInject(l);logAct((l.dir==='i_owe'?'استلمت سلفة من ':'سلّفت لـ ')+l.person,l.amount,l.dir==='i_owe'?'income':'expense')}
 save();closeModal();renderAll();cloudAutoPush();toast('اتحفظ ✅')}
function loanPay(id){const l=S.loans.find(x=>x.id===id);
 modal(`<h3>سداد لـ ${esc(l.person)}</h3><label>المبلغ (الباقي ${fmt(loanRemaining(l))})</label>

 const scat=S.categories.find(c=>c.name==='سلف وديون')||S.categories[0];

 else commitIncome({id:uid(),source:'تحصيل سلفة من: '+l.person,amount,date,loanId:l.id,loanPayId:pid},{silent:true});
 logAct('سداد '+(l.dir==='i_owe'?'لـ':'من ')+l.person,amount,l.dir==='i_owe'?'expense':'income');
 closeModal();toast('اتسدد ✅')}
function loanDel(id){const l=S.loans.find(x=>x.id===id);
 modal(`<h3>حذف سلفة ${esc(l.person)}</h3><p style="margin:10px 0">هتحذفها — طيب أثرها المالي؟</p>

  for(const k in S.months){S.months[k].expenses=S.months[k].expenses.filter(e=>e.loanId!==id);
   S.months[k].income=S.months[k].income.filter(e=>e.loanId!==id)}}

function billsHtml(){const mk=curMk();let html='';
 const bi=billIssues();
 S.bills.forEach(b=>{const paid=m(mk).expenses.some(e=>e.billId===b.id);
  let badge='';if(b.dueDay){if(paid)badge='<span class="tag" style="color:var(--inc)">مدفوعة ✅</span>';

  hist.sort((a,c)=>c.date.localeCompare(a.date));

function annualShow(y){
 let ti=0,te=0;const list=[];
 for(let i=1;i<=12;i++){const mk=y+'-'+pad(i);const inc=incomeTotal(mk),exp=expTotal(mk,false);
  if(inc||exp)list.push({mk,inc,exp});ti+=inc;te+=exp}

 if(!list.length){out.innerHTML='<div class="mut">مفيش بيانات في السنة دي</div>';return}
 const best=[...list].sort((a,b)=>(b.inc-b.exp)-(a.inc-a.exp))[0];
 const catT={};for(const k in S.months)if(k.startsWith(y+'-'))S.months[k].expenses.forEach(e=>{catT[e.catId]=(catT[e.catId]||0)+e.amount});
 const top=Object.entries(catT).sort((a,b)=>b[1]-a[1]).slice(0,5);

const CRC_TABLE=(()=>{const t=new Uint32Array(256);
 for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c}return t})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC_TABLE[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zipBuild(files){
 const enc=new TextEncoder();const parts=[];const central=[];let offset=0;
 const dt=new Date();const time=((dt.getHours()<<11)|(dt.getMinutes()<<5)|(dt.getSeconds()>>1))&0xFFFF;
 const date=(((dt.getFullYear()-1980)<<9)|((dt.getMonth()+1)<<5)|dt.getDate())&0xFFFF;
 files.forEach(f=>{const nameU8=enc.encode(f.name);const crc=crc32(f.data);
  const lh=new DataView(new ArrayBuffer(30));
  lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0,true);
  lh.setUint16(8,0,true);lh.setUint16(10,time,true);lh.setUint16(12,date,true);
  lh.setUint32(14,crc,true);lh.setUint32(18,f.data.length,true);lh.setUint32(22,f.data.length,true);
  lh.setUint16(26,nameU8.length,true);lh.setUint16(28,0,true);
  parts.push(new Uint8Array(lh.buffer),nameU8,f.data);
  const ch=new DataView(new ArrayBuffer(46));
  ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);
  ch.setUint16(8,0,true);ch.setUint16(10,0,true);ch.setUint16(12,time,true);ch.setUint16(14,date,true);
  ch.setUint32(16,crc,true);ch.setUint32(20,f.data.length,true);ch.setUint32(24,f.data.length,true);
  ch.setUint16(28,nameU8.length,true);ch.setUint16(30,0,true);ch.setUint16(32,0,true);
  ch.setUint16(34,0,true);ch.setUint16(36,0,true);ch.setUint32(38,0,true);ch.setUint32(42,offset,true);
  central.push(new Uint8Array(ch.buffer),nameU8);
  offset+=30+nameU8.length+f.data.length});
 const cdSize=central.reduce((a,p)=>a+p.length,0);
 const eo=new DataView(new ArrayBuffer(22));
 eo.setUint32(0,0x06054b50,true);eo.setUint16(8,files.length,true);eo.setUint16(10,files.length,true);
 eo.setUint32(12,cdSize,true);eo.setUint32(16,offset,true);eo.setUint16(20,0,true);
 return new Blob([...parts,...central,new Uint8Array(eo.buffer)],
  {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}

 confirmDlg('آخر تأكيد!',()=>{localStorage.removeItem(KEY);location.reload()})})}
function integrity(){let issues=0,html='';
 S.gameyas.forEach(g=>{(g.payments||[]).forEach((p,i)=>{if(!p)return;
  const lk=(g.links||{})[i];let ok=false;
  if(lk){const arr=m(lk.monthKey).expenses;ok=arr.some(e=>e.id===lk.expenseId)}
  if(!ok){issues++;html+=`<div class="alert yel">قسط جمعية "${esc(g.name)}" رقم ${i+1} ناقص أثره المالي
   <button class="btn sm" onclick="fixGameya('${g.id}',${i})">إصلاح</button></div>`}})});
 S.loans.forEach(l=>{if(l.injId){
  const arr=l.dir==='i_owe'?m(mkOf(l.date)).income:m(mkOf(l.date)).expenses;
  if(!arr.some(e=>e.id===l.injId)){issues++;html+=`<div class="alert yel">سلفة "${esc(l.person)}" ناقص قيدها
   <button class="btn sm" onclick="fixLoan('${l.id}')">إصلاح</button></div>`}}});
 $('#intOut').innerHTML=issues?html:`<div class="alert" style="background:var(--chip)">كله سليم ✅</div>`}
function fixGameya(gid,idx){const g=S.gameyas.find(x=>x.id===gid);
 const gcat=S.categories.find(c=>c.name==='جمعية')||S.categories[0];
 const due=addMk(mkOf(g.startDate),idx),dd=due+'-'+pad(+g.startDate.slice(8,10));
 const e={id:uid(),catId:gcat.id,desc:'قسط جمعية: '+g.name,amount:g.amount,date:dd,fromLeftover:false,gameyaId:g.id,gameyaIdx:idx};
 m(due).expenses.push(e);g.links=g.links||{};g.links[idx]={monthKey:due,expenseId:e.id};
 save();integrity();toast('اتصلح ✅')}
function fixLoan(id){const l=S.loans.find(x=>x.id===id);loanInject(l);save();integrity();toast('اتصلح ✅')}

function checkReminder(){
 if(S.uiSettings.reminders===false)return;

 setTimeout(()=>{sfx('alarm');speak('لسه مسجلتش مصاريف النهاردة... سجلها قبل ما تنام! 🌙');

/* ================= محرك الأصوات ================= */
let AC=null;
function ac(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
 if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function gVol(){let v=Math.round(+S.uiSettings.vol);if(isNaN(v))v=60;return Math.min(100,Math.max(0,v))/100}
function tone(f,t0,dur,type,v,fEnd){const a=ac();if(!a)return;
 const t=a.currentTime+t0;
 const o=a.createOscillator(),g=a.createGain();
 o.type=type||'sine';o.frequency.setValueAtTime(f,t);
 if(fEnd)o.frequency.exponentialRampToValueAtTime(Math.max(30,fEnd),t+dur);
 const vv=(v||.5)*gVol();
 g.gain.setValueAtTime(.0001,t);
 g.gain.exponentialRampToValueAtTime(Math.max(.001,vv),t+.015);
 g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.05)}
function sfx(name){if(!S||!S.uiSettings.soundEnabled)return;
 switch(name){
 case 'coin':tone(1319,0,.09,'square',.28);tone(1760,.09,.22,'square',.28);break;
 case 'happy':tone(523,0,.12,'sine',.5);tone(659,.12,.12,'sine',.5);tone(784,.24,.14,'sine',.5);tone(1047,.38,.3,'sine',.45);break;
 case 'angry':tone(420,0,.16,'sawtooth',.4,300);tone(300,.16,.18,'sawtooth',.4,200);tone(210,.34,.32,'sawtooth',.4,120);break;
 case 'shock':tone(880,0,.09,'square',.45);tone(988,.1,.09,'square',.45);tone(660,.22,.38,'sawtooth',.5,170);break;
 case 'excited':tone(659,0,.08,'triangle',.42);tone(880,.09,.08,'triangle',.42);tone(659,.18,.08,'triangle',.42);tone(1047,.27,.22,'triangle',.45);break;
 case 'wake':tone(440,0,.12,'sine',.42);tone(554,.13,.18,'sine',.42);break;
 case 'pop':tone(560,0,.06,'sine',.5,920);break;
 case 'success':tone(784,0,.11,'sine',.4);tone(988,.12,.11,'sine',.4);tone(1319,.24,.3,'sine',.4);break;
 case 'error':tone(220,0,.18,'square',.35,180);tone(180,.2,.26,'square',.35,130);break;
 case 'alarm':for(let i=0;i<3;i++){tone(880,i*.3,.13,'triangle',.45);tone(660,i*.3+.15,.11,'triangle',.4)}break;
 case 'sleep':tone(392,0,.32,'sine',.24,330);tone(330,.34,.42,'sine',.2,262);break}}

/* ================= زاحف ================= */
let mascotTimer=null,zTimer=null,chatterTimer=null,lastTap=0;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const talkLv=()=>S.uiSettings.chatter||'high';
const bubSec=()=>{const v=Math.round(+S.uiSettings.bubbleSec);return(v>=2&&v<=180)?v:12};
const M={em:'sleep',blinkT:null,wanderT:null,trackUntil:0,talkI:null};
const MOUTH={sleep:'M55 55 q5 2 10 0',idle:'M52 55 q8 4.5 16 0',
 happy:'M49 53 q11 9 22 0',excited:'M60 51.5 a5.5 5.5 0 1 0 .01 0',
 angry:'M52 58.5 q8 -5.5 16 0',grump:'M53 57.5 q7 -4 14 0',shock:'M60 51 a6.5 6.5 0 1 0 .01 0'};
const EYEC={sleep:'#2EE6A8',idle:'#2EE6A8',happy:'#2EE6A8',excited:'#FFD166',angry:'#FF7B7B',grump:'#8FA6C6',shock:'#FFD166'};
const ANTC={sleep:'#8CA0BF',idle:'#FFC15E',happy:'#FFD166',excited:'#2EE6A8',angry:'#FF6B6B',grump:'#8CA0BF',shock:'#FFD166'};
const CHESTC={sleep:'#00C48C',idle:'#00C48C',happy:'#FFD166',excited:'#2EE6A8',angry:'#FF6B6B',grump:'#5E6F8C',shock:'#FFD166'};
function setEm(em){if(!em)em='sleep';M.em=em;
 const el=$('#mascot');if(!el)return;el.dataset.em=em;
 const eg=$('#eyesG'),es=$('#eyesShut');
 if(em==='sleep'){eg.style.display='none';es.style.display='block'}
 else{eg.style.display='block';es.style.display='none'}
 $('#mouth').setAttribute('d',MOUTH[em]||MOUTH.idle);
 const c=EYEC[em]||EYEC.idle;
 $('#eyeL').setAttribute('fill',c);$('#eyeR').setAttribute('fill',c);
 $('#mouth').setAttribute('stroke',c);
 $('#browL').setAttribute('fill',c);$('#browR').setAttribute('fill',c);
 $('#eyesShut').querySelectorAll('path').forEach(p=>p.setAttribute('stroke',c));
 $('#antLight').setAttribute('fill',ANTC[em]||ANTC.idle);
 $('#chest').setAttribute('fill',CHESTC[em]||CHESTC.idle);
 const bl=$('#browL'),br=$('#browR');
 bl.style.transform='';br.style.transform='';
 if(em==='angry'){bl.style.transform='rotate(22deg) translateY(2.5px)';br.style.transform='rotate(-22deg) translateY(2.5px)'}
 else if(em==='grump'){bl.style.transform='rotate(12deg) translateY(1.5px)';br.style.transform='rotate(-12deg) translateY(1.5px)'}
 else if(em==='happy'||em==='excited'){bl.style.transform='translateY(-2.5px)';br.style.transform='translateY(-2.5px)'}
 else if(em==='shock'){bl.style.transform='translateY(-4px)';br.style.transform='translateY(-4px)'}}
function revertBase(){const grump=S.mascotMood.date===todayISO()&&S.mascotMood.spentCats.length>=2;
 setEm(grump?'grump':'sleep')}
function mascotFace(){revertBase()}
function blinkLoop(){clearTimeout(M.blinkT);
 M.blinkT=setTimeout(()=>{if(M.em!=='sleep'&&S.uiSettings.mascotEnabled){
  $('#eyesG').style.display='none';$('#eyesShut').style.display='block';
  setTimeout(()=>{if(M.em!=='sleep'){$('#eyesG').style.display='block';$('#eyesShut').style.display='none'}},140)}
 blinkLoop()},2400+Math.random()*3200)}
function wanderLoop(){clearTimeout(M.wanderT);
 if(Date.now()>M.trackUntil&&M.em!=='sleep'){
  const tx=(Math.random()*2-1)*2.4,ty=(Math.random()*2-1)*1.5;
  const p=$('#pupils');if(p)p.style.transform=`translate(${tx}px,${ty}px)`}
 M.wanderT=setTimeout(wanderLoop,1700+Math.random()*2300)}
function trackEye(x,y){if(!S.uiSettings.mascotEnabled)return;
 const r=$('#mascot').getBoundingClientRect();if(!r.width)return;
 const cx=r.left+r.width/2,cy=r.top+r.height*0.4;
 let dx=Math.max(-2.6,Math.min(2.6,(x-cx)/55)),dy=Math.max(-2,Math.min(2,(y-cy)/55));
 M.trackUntil=Date.now()+1400;
 const p=$('#pupils');if(p)p.style.transform=`translate(${dx}px,${dy}px)`}
document.addEventListener('mousemove',e=>trackEye(e.clientX,e.clientY),{passive:true});
document.addEventListener('touchmove',e=>{const t=e.touches[0];if(t)trackEye(t.clientX,t.clientY)},{passive:true});
function spawnZ(){if(!S||!S.uiSettings.mascotEnabled||M.em!=='sleep')return;
 const el=$('#mascot');
 const z=document.createElement('div');z.className='mz';z.textContent='z';
 const r=el.getBoundingClientRect();
 z.style.left=(r.left+r.width*(0.5+Math.random()*0.35))+'px';
 z.style.top=(r.top-4)+'px';
 document.body.appendChild(z);setTimeout(()=>z.remove(),2400)}
function mascotVis(){const on=!!S.uiSettings.mascotEnabled;
 $('#mascot').style.display=on?'block':'none';
 $('#bubbles').style.display=on?'flex':'none';
 clearInterval(zTimer);zTimer=null;clearTimeout(chatterTimer);chatterTimer=null;
 if(on){revertBase();zTimer=setInterval(spawnZ,1800);scheduleChatter()}}
function speak(t,sec){if(!S.uiSettings.mascotEnabled)return;
 const dur=(sec||bubSec())*1000;
 if(M.em==='sleep')setEm('idle');
 const b=document.createElement('div');b.className='bub';b.textContent=t;
 const box=$('#bubbles');box.appendChild(b);
 while(box.children.length>5)box.removeChild(box.firstChild);
 setTimeout(()=>{if(b.parentNode)b.parentNode.removeChild(b)},dur);
 clearInterval(M.talkI);
 const mo=$('#mouth');let o=false;
 M.talkI=setInterval(()=>{o=!o;
  mo.setAttribute('d',o?'M53 53.5 q7 6.5 14 0':'M54 55.5 q6 2 12 0')},150);
 setTimeout(()=>{clearInterval(M.talkI);
  if(M.em!=='sleep')mo.setAttribute('d',MOUTH[M.em]||MOUTH.idle)},Math.min(dur,7000));
 clearTimeout(mascotTimer);
 mascotTimer=setTimeout(revertBase,Math.max(dur+900,4600))}
function mascotReact(kind){if(!S.uiSettings.mascotEnabled)return;
 if(kind==='expense'&&lastCatId){if(S.mascotMood.date!==todayISO())S.mascotMood={date:todayISO(),spentCats:[]};
  if(!S.mascotMood.spentCats.includes(lastCatId))S.mascotMood.spentCats.push(lastCatId);save()}
 let msg,em,snd;
 if(kind==='income'){em='happy';snd='coin';msg=pick(PH.income)}
 else if(kind==='expense'){em='angry';snd='angry';msg=pick(PH.expense)}
 else if(kind==='shock'){em='shock';snd='shock';msg=pick(PH.big)}
 else if(kind==='savings'){em='excited';snd='excited';msg=pick(PH.savings)}
 else if(kind==='greet'){em='excited';snd='excited';msg=greetMsg()}
 else{em='idle';snd='wake';msg=pick(PH.wake)}
 setEm(em);sfx(snd);speak(msg)}
function mascotNav(p){if(!S.uiSettings.mascotEnabled)return;
 const lv=talkLv();const prob=lv==='high'?.6:lv==='mid'?.3:.1;
 if(Math.random()>prob)return;
 setTimeout(()=>{if(!document.hidden)speak(pick(PH.nav[p]||PH.wake))},700+Math.random()*700)}
function scheduleChatter(){clearTimeout(chatterTimer);
 const lv=talkLv();
 const d=lv==='high'?11000+Math.random()*9000:lv==='mid'?28000+Math.random()*22000:70000+Math.random()*50000;
 chatterTimer=setTimeout(chatterTick,d)}
function restartChatter(){scheduleChatter()}
function chatterTick(){scheduleChatter();
 if(!S.uiSettings.mascotEnabled||document.hidden)return;
 if($('#lock')&&!$('#lock').classList.contains('hidden'))return;
 const hr=new Date().getHours();
 const notLogged=!m(curMk()).expenses.some(e=>e.date===todayISO()&&!cat(e.catId).isSavings);
 let pool=[];
 if(hr>=20&&notLogged)pool=pool.concat(PH.nag,PH.nag);
 pool=pool.concat(PH.tips,PH.jokes,PH.idle,PH.idle);
 speak(pick(pool))}
function mascotTap(){const now=Date.now();
 if(now-lastTap<450){const el=$('#mascot');el.classList.remove('spin');void el.offsetWidth;
  el.classList.add('spin');buzz(20);sfx('excited');
  speak(pick(['ووووه! بتعمل فيا إيه! 🌀','خليتني أدور في الهوا! 😵']));lastTap=0}
 else{lastTap=now;buzz(8);sfx('pop');
  if(M.em==='sleep'){setEm('idle');sfx('wake');speak(greetMsg())}
  else{speak(pick(PH.wake))}}}
let lastCatId=null;
const _ce=commitExpense;commitExpense=function(e,o){lastCatId=e.catId;_ce(e,o)};

expense:['يا نهار أسود! فلوسي راحت فين؟! 😭','تاني؟! بطّل تصرف يا معلم! 😤','رصيدي بيقل بشكل مخيف! 😖','مرتبك بيطير زي الكيتة! 🪁','أنا مش هبطل أذكرك! 😡'],
big:['يا الله! دي مصروف كبيرة يا معلم! 😱','واحدة كبيرة كده؟ خد بالك من الرصيد!','استنى استنى... المبلغ ده كله؟! 🤯'],
savings:['أخيرًا حد يفكر في المستقبل! 🤓','ادخار؟ إنت إنسان محترم! 🫡','يا بطل! كمّل كده 🌟'],

nav:{home:['أهلاً في الداش بورد! 📊','الرصيد فوق في الشريط 👀'],
month:['سجلت مصاريفك ولا لسه يا نجم؟ 😏','اسحب بإصبعك يمين وشمال... جرب! 👉👈'],
cats:['كل فئة ليها حكاية 💸','ألوان الفئات حلوة، مش كده؟ 🎨'],

set:['متلعبش في حاجة مهمة! ⚠️','جرّب أزرار الأصوات! 🔊']},
tips:['نصيحة: ادفع لنفسك الأول — ادخر 10% 💰','نصيحة: القهوة اليومية × 30 = ميزانية كاملة! ☕',
'نصيحة: قبل شراء كبير استنى 24 ساعة ⏰','نصيحة: سجل المصروف في نفس اللحظة 📝'],

function greetMsg(){const tot=totalWallets();const s=tot<0?' سالب يا هندسة! 😨':'';
 return pick(['أهلاً! محافظك فيها '+fmt(tot)+s+' 😏','رجعت؟ الرصيد معانا '+fmt(tot)+s+' 💳','أنا قلقان على '+fmt(tot)+s+' 🥺'])}
/* ============ مودال ============ */
function modal(html){$('#modalBox').innerHTML=html;$('#modal').classList.remove('hidden')}
function closeModal(){$('#modal').classList.add('hidden')}
function confirmDlg(msg,cb){modal(`<h3>تأكيد</h3><p style="margin:12px 0">${msg}</p>
 <button class="btn wide" id="cfOk">أيوه كمّل</button>
 <button class="btn ghost wide" style="margin-top:6px" onclick="closeModal()">إلغاء</button>`);
 $('#cfOk').onclick=()=>{closeModal();cb()}}
 $('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
/* ============ الثيم والتشغيل ============ */
function applyTheme(){const t=S.uiSettings.theme||'dark';
 const dark=t==='dark'||(t==='auto'&&window.matchMedia('(prefers-color-scheme: dark)').matches);
 document.documentElement.dataset.theme=dark?'dark':'light';
 if(S.uiSettings.accent)document.documentElement.style.setProperty('--acc',S.uiSettings.accent);
 else document.documentElement.style.removeProperty('--acc');
 const mt=$('#metaTheme');if(mt)mt.content=dark?'#0B1220':'#F4F6FB'}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(S.uiSettings.theme==='auto')applyTheme()});
load();applyTheme();setupManifest();mascotVis();setEm('sleep');
blinkLoop();wanderLoop();

else setTimeout(()=>mascotReact('greet'),1500);
renderAll();
checkReminder();
